syntax = "proto3";

package memos.api.v1;

import "google/api/annotations.proto";
import "google/api/client.proto";
import "google/api/field_behavior.proto";
import "google/api/resource.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option go_package = "gen/api/v1";

service InboxService {
  // ListInboxes lists inbox notifications for a user.
  // Similar to GitHub's "List notifications for the authenticated user"
  rpc ListInboxes(ListInboxesRequest) returns (ListInboxesResponse) {
    option (google.api.http) = {get: "/api/v1/{parent=users/*}/inboxes"};
    option (google.api.method_signature) = "parent";
  }
  // GetInbox gets a single inbox notification.
  // Similar to GitHub's "Get a thread"
  rpc GetInbox(GetInboxRequest) returns (Inbox) {
    option (google.api.http) = {get: "/api/v1/{name=inboxes/*}"};
    option (google.api.method_signature) = "name";
  }
  // UpdateInbox updates an inbox notification (typically for marking as read/done).
  // Similar to GitHub's "Mark a thread as read" or "Mark a thread as done"
  rpc UpdateInbox(UpdateInboxRequest) returns (Inbox) {
    option (google.api.http) = {
      patch: "/api/v1/{inbox.name=inboxes/*}"
      body: "inbox"
    };
    option (google.api.method_signature) = "inbox,update_mask";
  }
  // DeleteInbox deletes an inbox notification.
  // Similar to GitHub's "Delete a thread subscription"
  rpc DeleteInbox(DeleteInboxRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {delete: "/api/v1/{name=inboxes/*}"};
    option (google.api.method_signature) = "name";
  }
  // MarkInboxAsRead marks an inbox notification as read.
  // Similar to GitHub's "Mark a thread as read"
  rpc MarkInboxAsRead(MarkInboxAsReadRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      post: "/api/v1/{name=inboxes/*}:markAsRead"
      body: "*"
    };
    option (google.api.method_signature) = "name";
  }
  // MarkAllInboxesAsRead marks all inbox notifications as read.
  // Similar to GitHub's "Mark notifications as read"
  rpc MarkAllInboxesAsRead(MarkAllInboxesAsReadRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      post: "/api/v1/{parent=users/*}/inboxes:markAllAsRead"
      body: "*"
    };
    option (google.api.method_signature) = "parent";
  }
}

message Inbox {
  option (google.api.resource) = {
    type: "memos.api.v1/Inbox"
    pattern: "inboxes/{inbox}"
    name_field: "name"
    singular: "inbox"
    plural: "inboxes"
  };

  // The resource name of the inbox notification.
  // Format: inboxes/{inbox}
  string name = 1 [
    (google.api.field_behavior) = OUTPUT_ONLY,
    (google.api.field_behavior) = IDENTIFIER
  ];

  // The sender of the inbox notification.
  // Format: users/{user}
  // Similar to GitHub's notification actor
  string sender = 2 [
    (google.api.field_behavior) = OUTPUT_ONLY,
    (google.api.resource_reference) = {type: "memos.api.v1/User"}
  ];

  // The receiver of the inbox notification.
  // Format: users/{user}
  string receiver = 3 [
    (google.api.field_behavior) = OUTPUT_ONLY,
    (google.api.resource_reference) = {type: "memos.api.v1/User"}
  ];

  // Whether the notification is unread.
  // Similar to GitHub's "unread" field
  bool unread = 4 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. The creation timestamp.
  google.protobuf.Timestamp create_time = 5 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. The last update timestamp.
  // Similar to GitHub's "updated_at"
  google.protobuf.Timestamp update_time = 6 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Optional. When the notification was last read.
  // Similar to GitHub's "last_read_at"
  optional google.protobuf.Timestamp last_read_at = 7 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The reason for receiving this notification.
  // Similar to GitHub's "reason" field
  // Examples: "comment", "mention", "version_update", "assign", "review_requested"
  string reason = 8 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The subject of the notification.
  // Similar to GitHub's "subject" object
  Subject subject = 9 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The activity associated with this inbox notification.
  // Format: activities/{activity}
  string activity = 10 [
    (google.api.field_behavior) = OUTPUT_ONLY,
    (google.api.resource_reference) = {type: "memos.api.v1/Activity"}
  ];

  // Subject of the notification.
  // Similar to GitHub's notification subject
  message Subject {
    // The title of the subject.
    // Similar to GitHub's "subject.title"
    string title = 1;

    // The type of subject.
    // Examples: "Memo", "Comment", "Version"
    // Similar to GitHub's "subject.type" (Issue, PullRequest, etc.)
    string type = 2;

    // The URL to the subject.
    // Similar to GitHub's "subject.url"
    string url = 3;

    // Optional. The URL to the latest comment.
    // Similar to GitHub's "subject.latest_comment_url"
    optional string latest_comment_url = 4;
  }
}

message ListInboxesRequest {
  // Required. The parent resource whose inboxes will be listed.
  // Format: users/{user}
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "memos.api.v1/User"}
  ];

  // Optional. If true, show only unread notifications.
  // Similar to GitHub's "all" parameter (default is unread only)
  bool unread_only = 2 [(google.api.field_behavior) = OPTIONAL];

  // Optional. The maximum number of inboxes to return.
  // The service may return fewer than this value.
  // If unspecified, at most 50 inboxes will be returned.
  // The maximum value is 100; values above 100 will be coerced to 100.
  int32 page_size = 3 [(google.api.field_behavior) = OPTIONAL];

  // Optional. A page token, received from a previous `ListInboxes` call.
  // Provide this to retrieve the subsequent page.
  string page_token = 4 [(google.api.field_behavior) = OPTIONAL];

  // Optional. Filter notifications by reason.
  // Similar to GitHub's filtering by reason
  // Examples: "comment", "mention", "version_update"
  string reason = 5 [(google.api.field_behavior) = OPTIONAL];

  // Optional. Only show notifications updated after the given time.
  // Similar to GitHub's "since" parameter
  optional google.protobuf.Timestamp since = 6 [(google.api.field_behavior) = OPTIONAL];

  // Optional. Only show notifications updated before the given time.
  // Similar to GitHub's "before" parameter
  optional google.protobuf.Timestamp before = 7 [(google.api.field_behavior) = OPTIONAL];
}

message ListInboxesResponse {
  // The list of inbox notifications.
  repeated Inbox inboxes = 1;

  // A token that can be sent as `page_token` to retrieve the next page.
  // If this field is omitted, there are no subsequent pages.
  string next_page_token = 2;
}

message GetInboxRequest {
  // Required. The resource name of the inbox notification.
  // Format: inboxes/{inbox}
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "memos.api.v1/Inbox"}
  ];
}

message UpdateInboxRequest {
  // Required. The inbox notification to update.
  Inbox inbox = 1 [(google.api.field_behavior) = REQUIRED];

  // Required. The list of fields to update.
  // Supported fields: unread, last_read_at
  google.protobuf.FieldMask update_mask = 2 [(google.api.field_behavior) = REQUIRED];
}

message DeleteInboxRequest {
  // Required. The resource name of the inbox notification to delete.
  // Format: inboxes/{inbox}
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "memos.api.v1/Inbox"}
  ];
}

message MarkInboxAsReadRequest {
  // Required. The resource name of the inbox notification.
  // Format: inboxes/{inbox}
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "memos.api.v1/Inbox"}
  ];

  // Optional. The timestamp to mark as read at.
  // If not specified, uses the current time.
  optional google.protobuf.Timestamp read_at = 2 [(google.api.field_behavior) = OPTIONAL];
}

message MarkAllInboxesAsReadRequest {
  // Required. The parent resource whose inboxes will be marked as read.
  // Format: users/{user}
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "memos.api.v1/User"}
  ];

  // Optional. The timestamp to mark as read at.
  // If not specified, uses the current time.
  // Similar to GitHub's "last_read_at" parameter
  optional google.protobuf.Timestamp read_at = 2 [(google.api.field_behavior) = OPTIONAL];
}
